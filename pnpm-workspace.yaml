# 14 days, expressed in minutes: newly published versions are not installed until
# they have had time to be flagged and unpublished if compromised.
minimumReleaseAge: 20160
# esbuild is tsup's bundler; its postinstall script fetches the platform binary without
# which `pnpm build` cannot run. No other dependency is allowed to run build scripts.
allowBuilds:
  esbuild: true
